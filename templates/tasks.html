{% extends "base.html" %}
{% block title %}Tasks - Farm Management System{% endblock %}
{% block page_title %}Task Management{% endblock %}

{% block content %}
<div class="crops-container">
  <div class="filter-controls">
    <div class="row w-100">
      <div class="col-md-2">
        <label class="form-label">Farm</label>
        <select id="farmFilter" class="form-select"><option value="">All Farms</option></select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Worker</label>
        <select id="assignedFilter" class="form-select"><option value="">All</option></select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Status</label>
        <select id="statusFilter" class="form-select">
          <option value="">All</option>
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Priority</label>
        <select id="priorityFilter" class="form-select">
          <option value="">All</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Search</label>
        <input type="text" class="form-control" id="searchInput" placeholder="Search tasks...">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        {% if session.user_id %}
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal"><i class="fas fa-plus"></i> Add Task</button>
        {% endif %}
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-success" onclick="exportTasks()"><i class="fas fa-download"></i> Export</button>
      </div>
    </div>
  </div>

  <div class="table-container">
    <div class="table-header">
      <h5><i class="fas fa-tasks"></i> Tasks</h5>
      <span class="badge bg-primary" id="taskCount">0 tasks</span>
    </div>
    <div id="tasksTable">
      <div class="text-center p-4"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>
    </div>
  </div>
</div>

<!-- Add/Edit Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="fas fa-plus"></i> Add / Edit Task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="addTaskForm">
        <input type="hidden" id="editTaskId" value="">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <label class="form-label">Farm *</label>
              <select id="taskFarmSelect" class="form-select" required><option value="">Select Farm</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Title *</label>
              <input id="taskTitle" class="form-control" required>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-6">
              <label class="form-label">Assign to</label>
              <select id="taskAssignedSelect" class="form-select"><option value="">Unassigned</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select id="taskStatus" class="form-select"><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="blocked">Blocked</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Priority</label>
              <select id="taskPriority" class="form-select"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option></select>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-6">
              <label class="form-label">Due Date</label>
              <input id="taskDueDate" type="date" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Notes</label>
              <input id="taskDesc" class="form-control" placeholder="Short description">
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label">Description (details)</label>
            <textarea id="taskDescriptionFull" class="form-control" rows="4"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Save Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// Utility function to escape HTML to prevent XSS
function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

// state
let tasksData = [];
let labourData = [];
let farmsData = [];

// read session info from base <body>
const rawSessionUserId = document.body.getAttribute('data-session-user-id');
const sessionUserId = rawSessionUserId ? Number(rawSessionUserId) : null;
const userRole = document.body.getAttribute('data-session-role') || '';

document.addEventListener('DOMContentLoaded', function() {
  loadFarms();
  loadLabour();
  loadTasks();
  setupTaskEvents();
});

function setupTaskEvents() {
  const form = document.getElementById('addTaskForm');
  if (form) {
    form.addEventListener('submit', function(e){
      e.preventDefault();
      saveTask();
    });
  }
  const ff = document.getElementById('farmFilter');
  if (ff) ff.addEventListener('change', filterTasks);
  const af = document.getElementById('assignedFilter');
  if (af) af.addEventListener('change', filterTasks);
  const sf = document.getElementById('statusFilter');
  if (sf) sf.addEventListener('change', filterTasks);
  const pf = document.getElementById('priorityFilter');
  if (pf) pf.addEventListener('change', filterTasks);
}

function loadFarms() {
  fetch('/api/farms')
    .then(r => r.json())
    .then(data => {
      farmsData = Array.isArray(data) ? data : [];
      const fFilter = document.getElementById('farmFilter');
      const fSelect = document.getElementById('taskFarmSelect');
      if (fFilter) fFilter.innerHTML = '<option value="">All Farms</option>';
      if (fSelect) fSelect.innerHTML = '<option value="">Select Farm</option>';
      farmsData.forEach(f => {
        const o1 = document.createElement('option'); o1.value = f.id; o1.textContent = f.name; if (fFilter) fFilter.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = f.id; o2.textContent = f.name; if (fSelect) fSelect.appendChild(o2);
      });
    })
    .catch(err => {
      console.error('Failed to load farms', err);
    });
}

function loadLabour() {
  fetch('/api/labour')
    .then(r => r.json())
    .then(data => {
      labourData = Array.isArray(data) ? data : [];
      const aFilter = document.getElementById('assignedFilter');
      const aSelect = document.getElementById('taskAssignedSelect');
      if (aFilter) aFilter.innerHTML = '<option value="">All</option>';
      if (aSelect) aSelect.innerHTML = '<option value="">Unassigned</option>';
      labourData.forEach(l => {
        const name = `${l.first_name} ${l.last_name}`;
        const o1 = document.createElement('option'); o1.value = l.id; o1.textContent = name; if (aFilter) aFilter.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = l.id; o2.textContent = name; if (aSelect) aSelect.appendChild(o2);
      });
    })
    .catch(err => {
      console.error('Failed to load labour', err);
    });
}

function loadTasks() {
  showLoading(document.getElementById('tasksTable'));
  fetch('/api/tasks')
    .then(response => {
      if (!response.ok) {
        return response.json()
          .then(errJson => { throw new Error(errJson.error || `Server responded ${response.status}`); })
          .catch(() => { throw new Error(`Server responded ${response.status}`); });
      }
      return response.json();
    })
    .then(data => {
      if (data && data.error) throw new Error(data.error);
      tasksData = Array.isArray(data) ? data : [];
      displayTasks(tasksData);
      const count = document.getElementById('taskCount');
      if (count) count.textContent = `${tasksData.length} tasks`;
    })
    .catch(err => {
      console.error('Failed to load tasks:', err);
      showError(document.getElementById('tasksTable'), 'Failed to load tasks: ' + err.message);
    });
}

function displayTasks(list) {
  list = Array.isArray(list) ? list : [];
  const container = document.getElementById('tasksTable');
  
  if (list.length === 0) {
    container.innerHTML = '<div class="text-center p-4"><p>No tasks found</p></div>';
    return;
  }

  let html = `
      <div class="table-responsive">
          <table class="table table-striped table-hover table-sm">
              <thead>
                  <tr>
                      <th width="18%">Title</th>
                      <th width="15%">Farm</th>
                      <th width="12%">Assigned</th>
                      <th width="15%">Status</th>
                      <th width="10%">Priority</th>
                      <th width="12%">Due</th>
                      <th width="18%">Actions</th>
                  </tr>
              </thead>
              <tbody>
  `;

  list.forEach(task => {
    const statusMap = {
        'todo': { class: 'bg-secondary', text: 'To Do', icon: 'fa-list' },
        'in_progress': { class: 'bg-primary', text: 'In Progress', icon: 'fa-spinner' },
        'completed': { class: 'bg-success', text: 'Completed', icon: 'fa-check' },
        'blocked': { class: 'bg-warning', text: 'Blocked', icon: 'fa-ban' },
        'cancelled': { class: 'bg-danger', text: 'Cancelled', icon: 'fa-times' }
    };
    const status = statusMap[task.status] || { class: 'bg-secondary', text: task.status, icon: 'fa-question' };

    const priorityMap = {
        'low': { class: 'bg-info', text: 'Low' },
        'medium': { class: 'bg-warning', text: 'Medium' },
        'high': { class: 'bg-danger', text: 'High' },
        'critical': { class: 'bg-dark', text: 'Critical' }
    };
    const priority = priorityMap[task.priority] || { class: 'bg-secondary', text: task.priority };

    html += `
        <tr>
            <td><strong>${escapeHtml(task.title || 'N/A')}</strong></td>
            <td><small>${escapeHtml(task.farm_name || 'N/A')}</small></td>
            <td><small>${escapeHtml(task.assigned_name || 'Unassigned')}</small></td>
            <td>
                <span class="badge ${status.class}">
                    <i class="fas ${status.icon} me-1"></i>${status.text}
                </span>
            </td>
            <td><span class="badge ${priority.class}">${priority.text}</span></td>
            <td><small>${task.due_date ? formatDateShort(task.due_date) : 'N/A'}</small></td>
            <td>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-primary" onclick="viewTask(${task.id})" title="View">
                        <i class="fas fa-eye"></i>
                    </button>
                    ${sessionRoleIsEditor() ? `
                    <button class="btn btn-outline-success" onclick="editTask(${task.id})" title="Edit">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" title="More">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <ul class="dropdown-menu">
                        ${task.status !== 'todo' ? `<li><a class="dropdown-item" href="#" onclick="updateTaskStatus(${task.id}, 'todo')">Mark as To Do</a></li>` : ''}
                        ${task.status !== 'in_progress' ? `<li><a class="dropdown-item" href="#" onclick="updateTaskStatus(${task.id}, 'in_progress')">Mark In Progress</a></li>` : ''}
                        ${task.status !== 'completed' ? `<li><a class="dropdown-item" href="#" onclick="updateTaskStatus(${task.id}, 'completed')">Mark Completed</a></li>` : ''}
                        ${task.status !== 'blocked' ? `<li><a class="dropdown-item" href="#" onclick="updateTaskStatus(${task.id}, 'blocked')">Mark Blocked</a></li>` : ''}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="deleteTask(${task.id})">Delete Task</a></li>
                    </ul>
                    ` : ''}
                </div>
            </td>
        </tr>
    `;
  });

  html += `
              </tbody>
          </table>
      </div>
  `;

  container.innerHTML = html;
}

function sessionRoleIsEditor() {
  return ['admin', 'manager'].includes(userRole) || Boolean(sessionUserId);
}

function filterTasks() {
  const farm = document.getElementById('farmFilter') ? document.getElementById('farmFilter').value : '';
  const assigned = document.getElementById('assignedFilter') ? document.getElementById('assignedFilter').value : '';
  const status = document.getElementById('statusFilter') ? document.getElementById('statusFilter').value : '';
  const priority = document.getElementById('priorityFilter') ? document.getElementById('priorityFilter').value : '';
  let filtered = tasksData || [];
  if (farm) filtered = filtered.filter(t => String(t.farm_id) === String(farm));
  if (assigned) filtered = filtered.filter(t => String(t.assigned_to) === String(assigned));
  if (status) filtered = filtered.filter(t => t.status === status);
  if (priority) filtered = filtered.filter(t => t.priority === priority);
  displayTasks(filtered);
  const count = document.getElementById('taskCount');
  if (count) count.textContent = `${filtered.length} tasks`;
}

function saveTask() {
  const editId = document.getElementById('editTaskId').value;
  const payload = {
    farm_id: parseInt(document.getElementById('taskFarmSelect').value) || null,
    title: document.getElementById('taskTitle').value,
    description: document.getElementById('taskDescriptionFull').value,
    assigned_to: document.getElementById('taskAssignedSelect').value || null,
    status: document.getElementById('taskStatus').value,
    priority: document.getElementById('taskPriority').value,
    due_date: document.getElementById('taskDueDate').value || null
  };
  const url = editId ? `/api/tasks/${editId}` : '/api/tasks';
  const method = editId ? 'PUT' : 'POST';
  fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    .then(r => {
      if (!r.ok) {
        return r.json().then(j => { throw new Error(j.error || `Server returned ${r.status}`); }).catch(()=>{throw new Error(`Server returned ${r.status}`);});
      }
      return r.json();
    })
    .then(data => {
      if (data && data.error) throw new Error(data.error);
      showSuccess(editId ? 'Task updated' : 'Task created');
      hideModal('addTaskModal');
      const f = document.getElementById('addTaskForm');
      if (f) f.reset();
      document.getElementById('editTaskId').value = '';
      loadTasks();
    })
    .catch(err=> {
      console.error('Failed to save task:', err);
      showError(document.body, 'Failed to save task: ' + err.message);
    });
}

function viewTask(id) {
  const t = tasksData.find(x=>x.id===id);
  if (!t) {
    fetch(`/api/tasks/${id}`).then(r=>r.json()).then(openTaskView).catch(console.error);
  } else openTaskView(t);
}
function openTaskView(t) {
  alert(`Title: ${t.title}\nFarm: ${t.farm_name}\nAssigned: ${t.assigned_name || 'Unassigned'}\nStatus: ${t.status}\nPriority: ${t.priority}\nDue: ${t.due_date || 'N/A'}\n\n${t.description || ''}`);
}
function editTask(id) {
  const t = tasksData.find(x=>x.id===id);
  if (!t) {
    fetch(`/api/tasks/${id}`).then(r=>r.json()).then(openTaskModalForEdit).catch(console.error);
  } else openTaskModalForEdit(t);
}
function openTaskModalForEdit(t) {
  document.getElementById('editTaskId').value = t.id;
  document.getElementById('taskFarmSelect').value = t.farm_id || '';
  document.getElementById('taskTitle').value = t.title || '';
  document.getElementById('taskAssignedSelect').value = t.assigned_to || '';
  document.getElementById('taskStatus').value = t.status || 'todo';
  document.getElementById('taskPriority').value = t.priority || 'medium';
  document.getElementById('taskDueDate').value = t.due_date || '';
  document.getElementById('taskDesc').value = t.description || '';
  document.getElementById('taskDescriptionFull').value = t.description || '';
  showModal('addTaskModal');
}

function exportTasks() {
  if (!tasksData || tasksData.length===0) return showError(document.body,'No tasks to export');
  exportToCSV(tasksData, 'tasks_export.csv');
}

// Task management functions
function deleteTask(id) {
    deleteItem('/api/tasks', id, 'task');
}

function updateTaskStatus(taskId, newStatus) {
    fetch(`/api/tasks/${taskId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
    })
    .then(response => response.json())
    .then(data => {
        showSuccess('Task status updated successfully');
        loadTasks();
    })
    .catch(error => {
        console.error('Error updating task status:', error);
        showError(document.body, 'Failed to update task status');
    });
}
</script>
{% endblock %}
